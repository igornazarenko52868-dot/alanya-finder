<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alanya Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f7;--card:#fff;--ink:#0d2b3e;--mute:#5b7280;--line:#d6e2e6;--sea:#0e5c7a;--sea2:#14a3a0;--sand:#f0c776;--ok:#1b8a5a;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a24;--card:#12293a;--ink:#e6f1f5;--mute:#93aab6;--line:#234257;--sea:#3fb4d6;--sea2:#2fc4bf;--ok:#4cc38a;--bad:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.tag,.meta{color:var(--mute);font-size:.9rem;margin:2px 0}
.seg{display:flex;background:var(--card);border:2px solid var(--sea);border-radius:14px;padding:3px;gap:3px}
.seg button{font:inherit;font-weight:800;border:0;background:transparent;color:var(--sea);padding:10px 14px;border-radius:11px;cursor:pointer;min-width:56px}
.seg button[aria-pressed="true"]{background:var(--sea);color:#fff}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
.tabs button{font:inherit;font-weight:600;flex:none;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--sea2);box-shadow:inset 0 -3px 0 var(--sea2)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.note{background:color-mix(in srgb,var(--sand) 30%,var(--card));border:1px solid var(--sand);border-radius:12px;padding:10px 14px;font-size:.88rem;margin:8px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--mute);font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:8px 0 12px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 13px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.main{background:var(--sea);border-color:var(--sea);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px}.ph>*{z-index:1}.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.ph::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:clamp(240px,60vw,320px);overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;padding:10px 14px;color:#fff;font-weight:800;position:relative}
.fav{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);color:#c0392b;border:0;border-radius:50%;width:38px;height:38px;font-size:1.2rem;cursor:pointer}
.bd{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.bd b{background:var(--sand);color:#2a1d00;font-size:.75rem;padding:3px 9px;border-radius:99px}
.bd b.dn{background:#fff;color:var(--ok)}
.body{padding:14px;display:flex;flex-direction:column;gap:7px;flex:1}
.price{font-size:1.45rem;font-weight:800;color:var(--sea)}
.old{font-size:.9rem;color:var(--mute);text-decoration:line-through;margin-left:8px;font-weight:400}
.mk{font-weight:800;font-size:.85rem}.mk.lo{color:var(--ok)}.mk.hi{color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:.86rem}
.kv span{color:var(--mute)}
.pill{font-size:.78rem;font-weight:800;padding:2px 9px;border-radius:99px;border:1px solid var(--sea2);width:fit-content}
.ags{font-size:.82rem;color:var(--mute);border-top:1px dashed var(--line);padding-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{flex:1;min-width:80px}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:130px}
.src{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:8px;background:var(--card)}
.src span{overflow-wrap:anywhere;font-size:.88rem}
.tot{font-size:1.6rem;font-weight:800;color:var(--sea)}
svg text{fill:var(--ink);font-family:inherit}
.nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:1.3rem;cursor:pointer}.cnt{position:absolute;bottom:8px;right:12px;background:rgba(0,0,0,.5);color:#fff;border-radius:99px;padding:1px 8px;font-size:.78rem}#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;align-items:center;justify-content:center}#lb img{max-width:100%;max-height:100%;object-fit:contain}#lb .nv{background:rgba(255,255,255,.25)}#lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;background:rgba(255,255,255,.25);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:1.4rem;cursor:pointer}#pk .noprint{display:none}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:.8rem;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--sea2) 16%,var(--card));border:1px solid color-mix(in srgb,var(--sea2) 40%,var(--line))}@page{size:A4;margin:0}#bk{position:fixed;inset:0;overflow:auto;background:#e8e5dd;z-index:60;padding-bottom:40px;font-family:Manrope,system-ui,sans-serif;color:#1f2a24}.bkbar{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;background:#1f3d33;z-index:2}.pg{background:#fbfaf6;max-width:820px;margin:16px auto;padding:28px 32px;box-shadow:0 2px 14px rgba(0,0,0,.15);min-height:1000px;display:flex;flex-direction:column;gap:14px;color:#1f2a24}.big{font-family:"Playfair Display",Georgia,serif;font-weight:700;margin:0}.ph1{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d9d5ca;padding-bottom:12px;font-size:.85rem;color:#6b756f}.av{width:44px;height:44px;border-radius:12px;background:#27624c;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;margin-right:10px}.bkph{display:grid;gap:6px}.bkph img{width:100%;height:210px;object-fit:cover;border-radius:6px;display:block}.spec{display:flex;flex-wrap:wrap;border-top:1px solid #d9d5ca;border-bottom:1px solid #d9d5ca}.spec div{flex:1;min-width:105px;padding:10px 12px;border-right:1px solid #d9d5ca}.spec b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.15rem}.spec span{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:#6b756f}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}@media(max-width:640px){.two{grid-template-columns:1fr}.pg{padding:18px 14px}}.why li{margin-bottom:8px;list-style:none;font-size:.92rem}.box{background:#eaf2ed;border-radius:12px;padding:14px}.mbar{height:8px;border-radius:99px;background:#c8e1d3;position:relative;margin:16px 0 6px}.mbar i{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:#27624c;transform:translateX(-50%)}.pfoot{margin-top:auto;display:flex;justify-content:space-between;gap:10px;border-top:1px solid #d9d5ca;padding-top:10px;font-size:.8rem;color:#6b756f}@media print{body.bkon>*:not(#bk){display:none!important}body.bkon #bk{position:static;overflow:visible;background:#fff;padding:0}.bkbar{display:none}.pg{box-shadow:none;margin:0;max-width:none;min-height:0;height:296mm;box-sizing:border-box;padding:12mm 14mm;break-after:page;page-break-after:always;overflow:hidden}}
.ta{width:100%;margin-top:8px;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px}[hidden]{display:none!important}
@media print{header,.tabs,.note,.noprint,.acts,.fav{display:none!important}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1 id="h1"></h1><p class="tag" id="tag"></p></div>
<div class="tools">
<div class="seg" id="cur"><button data-c="EUR">€</button><button data-c="USD">$</button><button data-c="TRY">₺</button></div>
<div class="seg" id="lng" aria-label="Language"><button data-l="ru">Русский</button><button data-l="tr">Türkçe</button><button data-l="en">English</button></div>
</div>
</header>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="note noprint" id="note"></div>

<section id="v-s">
<div class="panel"><div class="fg">
<label><span data-t="price"></span><input id="f-price" type="number" min="0" step="1000" value="60000" inputmode="numeric"></label>
<label><span data-t="rooms"></span><select id="f-rooms"><option value="">-</option><option>0+1</option><option>1+1</option><option>2+1</option><option>3+1</option><option>4+1</option></select></label>
<label><span data-t="dist"></span><select id="f-dist"></select></label>
<label><span data-t="deed"></span><select id="f-deed"></select></label>
<label><span data-t="tpl"></span><select id="f-tp"></select></label>
<label style="flex-direction:row;align-items:center;gap:8px"><input id="f-np" type="checkbox" style="width:auto"><span data-t="npl"></span></label>
<label><span data-t="phl"></span><select id="f-ph"></select></label>
<label style="flex-direction:row;align-items:center;gap:8px"><input id="f-rj" type="checkbox" style="width:auto"><span data-t="rjl"></span></label>
<label><span data-t="who"></span><select id="f-who"></select></label>
<label><span data-t="seaf"></span><input id="f-sea" type="number" min="0" step="100" placeholder="m" inputmode="numeric"></label>
<label><span data-t="sort"></span><select id="f-sort"></select></label>
</div></div>
<div class="bar"><b id="count"></b><button class="btn" id="save-s"></button></div>
<div class="grid" id="grid"></div>
</section>

<section id="v-f" hidden>
<div class="panel noprint"><div class="row">
<label><span data-t="agn"></span><input id="a-name"></label>
<label><span data-t="agp"></span><input id="a-phone" inputmode="tel"></label>
<label><span data-t="komp"></span><input id="k-p" type="number" step="0.5" inputmode="decimal"></label>
<label><span data-t="komf"></span><input id="k-f" type="number" step="100" inputmode="numeric"></label>
<button class="btn main" id="pr"></button><button class="btn" id="cp"></button>
</div><p class="meta" data-t="pickh"></p><div class="row"><label><span data-t="clsel"></span><select id="cl-s"></select></label><label><span data-t="clnew"></span><input id="cl-n"></label><button class="btn main" id="cl-a" data-t="cladd"></button><button class="btn" id="cl-d" data-t="cldel"></button></div><div class="row" style="margin-top:8px"><label><span data-t="bkt"></span><input id="bk-t"></label><label><span data-t="bks"></span><input id="bk-s2"></label><label><span data-t="mail"></span><input id="a-mail" type="email"></label><label><span data-t="agy"></span><input id="a-agy"></label><label><span data-t="bkl"></span><select id="bk-l"><option value="p"></option><option value="t"></option></select></label><button class="btn main" id="bk-o" data-t="bkopen"></button></div><div class="row" style="margin-top:8px"><label><span data-t="shn"></span><select id="sh-n"><option>0</option><option>1</option><option>2</option><option>3</option><option>5</option><option selected>10</option></select></label><button class="btn main" id="sh-all" data-t="shall"></button><button class="btn" id="sh-txt" data-t="shtxt"></button></div></div>
<h2 id="pk-h" style="margin:4px 0"></h2>
<div class="grid" id="pk"></div>
</section>

<section id="v-m" hidden>
<p class="meta" data-t="maph"></p>
<div class="panel"><svg id="map" viewBox="0 0 640 260" style="width:100%;height:auto"></svg></div>
</section>

<section id="v-c" hidden>
<div class="panel"><div class="fg">
<label><span data-t="cprice"></span><input id="c-p" type="number" value="55000" inputmode="numeric"></label>
<label><span data-t="cdeed"></span><input id="c-d" type="number" value="4" step=".5"></label>
<label><span data-t="cag"></span><input id="c-a" type="number" value="2" step=".5"></label>
<label><span data-t="coth"></span><input id="c-o" type="number" value="700" step="50"></label>
</div>
<div style="margin-top:12px"><span class="meta" data-t="ctot"></span><div class="tot" id="c-t"></div><div class="meta" id="c-x"></div></div></div>
<div class="note" data-t="cwarn"></div>
<div class="panel"><b data-t="rates"></b><div class="fg" style="margin-top:8px">
<label><span>1 € = $</span><input id="r-u" type="number" step=".01"></label>
<label><span>1 € = ₺</span><input id="r-t" type="number" step=".5"></label></div></div>
</section>

<section id="v-a" hidden>
<p class="meta" data-t="alh"></p>
<div class="panel noprint"><label><span data-t="tg"></span><input id="tg" placeholder="@username / +90..."></label></div>
<div id="al"></div>
</section>

<section id='v-d' hidden>
<div class='panel'><b data-t='imp'></b><p class='meta' data-t='imph'></p>
<div class='fg'><label><span data-t='agc'></span><input id='i-a'></label><label><span data-t='ph1'></span><input id='i-t' inputmode='tel'></label></div>
<textarea id='i-x' rows='6' class='ta'></textarea>
<div class='row' style='margin-top:8px'><button class='btn main' id='i-b' data-t='impb'></button></div><p class='meta' id='i-r'></p></div>
<div class='panel'><b data-t='man'></b><div class='fg' style='margin-top:8px'>
<label><span data-t='dist'></span><input id='m-d' list='dl'><datalist id='dl'></datalist></label>
<label><span data-t='rooms'></span><select id='m-r'></select></label>
<label><span data-t='pr1'></span><input id='m-p' type='number' inputmode='numeric'></label>
<label><span data-t='ar1'></span><input id='m-m' type='number' inputmode='numeric'></label>
<label><span data-t='seaf'></span><input id='m-se' type='number' inputmode='numeric'></label>
<label><span data-t='fl'></span><input id='m-f' type='number' inputmode='numeric'></label>
<label><span data-t='age1'></span><input id='m-a' type='number' inputmode='numeric'></label>
<label><span data-t='aid1'></span><input id='m-i' type='number' inputmode='numeric'></label>
<label><span data-t='old1'></span><input id='m-old' type='number' inputmode='numeric'></label>
<label><span data-t='deed'></span><select id='m-dd'></select></label>
<label><span data-t='who'></span><select id='m-o'></select></label>
<label><span data-t='agc'></span><input id='m-ag'></label>
<label><span data-t='ph1'></span><input id='m-t' inputmode='tel'></label>
<label><span data-t='url1'></span><input id='m-u' type='url' inputmode='url'></label>
<label><span data-t='pht'></span><input id='m-ph' type='file' accept='image/*' multiple></label>
<label style='flex-direction:row;align-items:center;gap:8px'><input id='m-n' type='checkbox' style='width:auto'><span data-t='nw1'></span></label>
</div><div class='row' style='margin-top:10px'><button class='btn main' id='m-s' data-t='sv1'></button><button class='btn' id='m-c' data-t='cn1'></button></div><p class='meta' id='m-msg'></p></div>
<h3 data-t='mylist' style='margin:8px 0'></h3><div class='grid' id='my'></div>
<label style='flex-direction:row;align-items:center;gap:8px;margin:12px 0'><input type='checkbox' id='dm' style='width:auto'><span data-t='dem'></span></label>
<div class='panel'><b data-t='bkh'></b><p class='meta' data-t='bkn'></p><div class='row'><button class='btn' id='bk-c' data-t='bkc'></button><button class='btn' id='bk-r' data-t='bkr'></button></div><textarea id='bk-x' rows='3' class='ta'></textarea></div>
</section>
<section id="v-r" hidden>
<p class="meta" data-t="srh"></p>
<div class="row"><input id="s-in" type="url" inputmode="url" placeholder="https://..."><button class="btn main" id="s-add"></button></div>
<p class="meta" style="color:var(--bad)" id="s-err" hidden></p>
<div id="s-l"></div>
</section>
</div>

<div id="lb" hidden></div>
<div id="bk" hidden></div>
